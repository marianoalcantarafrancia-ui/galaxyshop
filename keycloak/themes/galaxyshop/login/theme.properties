# =============================================================================
#  Tema de login de GalaxyShop
#  Rubrica #8: interfaz de usuario personalizada con colores, logo e imagenes.
#
#  Hereda de keycloak.v2 y ANADE una hoja de estilos propia: la del padre se
#  carga primero, la de GalaxyShop despues, de modo que solo se redefine lo
#  necesario en lugar de reescribir todo el tema.
# =============================================================================
parent=keycloak.v2
import=common/keycloak

styles=css/login.css css/galaxyshop.css

locales=es,en

# Fondo y elementos visuales de la pantalla de acceso
kcLogoLink=http://localhost:4200

# Se muestra el selector de idioma
internationalizationEnabled=true
